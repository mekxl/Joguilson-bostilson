<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Adicionado controle de escala para evitar zoom no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protótipo - Survivors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU INICIAL -->
    <div id="main-menu">
        <h1 class="game-title">MATADOR DE BOLAS</h1>
        <div class="menu-options">
            <button id="btn-computador" class="menu-btn">[ COMPUTADOR ]</button>
            <button id="btn-celular" class="menu-btn">[ CELULAR ]</button>
        </div>
    </div>

    <!-- CONTROLES MOBILE -->
    <div id="mobile-controls" style="display: none;">
        <!-- Analógico Esquerdo (Movimento) -->
        <div class="joystick-base" id="base-left">
            <div class="joystick-stick" id="stick-left"></div>
        </div>
        
        <!-- Analógico Direito (Mira/Disparo) -->
        <div class="joystick-base" id="base-right">
            <div class="joystick-stick" id="stick-right"></div>
        </div>
    </div>
    
    <div id="game-container">
        <!-- Interface de Usuário -->
        <div id="ui-layer">
            <div id="top-bar">
                <div id="stats">
                    <div><span id="timer">00:00</span> - <span id="level-display">Nível: 0</span></div>
                    <div id="health-bg">
                        <div id="health-bar"></div>
                    </div>
                </div>
                <div id="skills-list"></div>
            </div>
            
            <div id="xp-bg">
                <div id="xp-bar"></div>
            </div>
            
            <!-- Tela de Subida de Nível -->
            <div id="level-up-screen" class="hidden clickable">
                <h2>Subiu de Nível!</h2>
                <p>Escolha uma habilidade:</p>
                <div id="cards-container"></div>
            </div>

            <!-- Tela de Fim de Jogo -->
            <div id="game-over-screen" class="hidden clickable">
                <h1>FIM DE JOGO</h1>
                <p>Sobreviveu por: <span id="final-time">00:00</span></p>
                <p>Nível alcançado: <span id="final-level">0</span></p>
                <button id="restart-btn">Tentar Novamente</button>
            </div>
        </div>

        <!-- Tela do Jogo -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script src="game.js"></script>
</body>
</html>
